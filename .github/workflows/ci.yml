name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is paused: cnsr refuses to run there until its test failures are fixed.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # Keep in step with the uv_build range in pyproject.toml.
          version: ">=0.13.0,<0.14"

      - name: Install dependencies
        run: uv sync

      - name: Python tests
        run: uv run pytest

      - name: Worker tests
        if: runner.os == 'Linux'
        # Node 22+ treats arguments as globs, so a bare directory is not accepted.
        run: uv run node --test tests/worker/*.test.mjs

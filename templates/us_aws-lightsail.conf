# AWS Lightsail 节点预设模版 - 美西俄勒冈 (Oregon, US)
# 使用方式: ./cnsr.sh init-aws -f us_aws-lightsail [--count 1]

PROVIDER="lightsail"          # 服务类型 (lightsail / ec2)
REGION="us-west-2"            # AWS 区域代号
ALIAS="us_aws-lightsail"      # 默认别名前缀 (多台时自动生成 us_aws-lightsail-1, us_aws-lightsail-2...)
BUNDLE="nano_3_0"             # 套餐规格: $5/月 (512MB RAM / 2 vCPU)
BLUEPRINT="debian_12"         # 系统镜像: Debian 12 (或 ubuntu_22_04)
KEY_PAIR=""                   # AWS 控制台上传的公钥名称 (留空则默认使用该区域 Default 公钥)

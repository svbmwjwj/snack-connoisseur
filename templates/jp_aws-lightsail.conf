# AWS Lightsail 节点预设模版 - 日本东京 (Tokyo, Japan)
# 使用方式: ./cnsr.sh init-aws -f jp_aws-lightsail [--count 3]

PROVIDER="lightsail"          # 服务类型 (lightsail / ec2)
REGION="ap-northeast-1"       # [必需] AWS 区域代码 (东京: ap-northeast-1)
ZONE=""                       # [可选] 可用区 (留空由 AWS 自动选择，或填 ap-northeast-1a)
ALIAS="jp_aws-lightsail"      # [必需] 默认别名前缀 (多台时自动生成 jp_aws-lightsail-1, jp_aws-lightsail-2...)
BUNDLE="nano_3_0"             # 套餐规格: $5/月 (512MB RAM / 2 vCPU)
BLUEPRINT="debian_12"         # 系统镜像: Debian 12 (或 ubuntu_22_04, debian_13)
KEY="jp_aws"                  # AWS 控制台上传的公钥名称 (留空则默认使用该区域 Default 公钥)

# --- 网络安全与防火墙策略 (Network Security & Firewall Policy) ---
SECURITY_PROFILE="strict"     # 安全策略: strict (最小权限仅 SSH+443，关 80) / default / custom
IP_STACK="dual"               # 双栈支持: dual (IPv4+IPv6) / ipv4 / ipv6
PORTS_TCP="22, 443"           # 放行 TCP 端口白名单
PORTS_UDP="443"               # 放行 UDP 端口 (Reality Xray / QUIC 必需)
CLOUD_FIREWALL_SYNC="true"    # 自动调用 AWS API 对齐云防火墙放行规则 (true / false)
HOST_FIREWALL="ufw"           # 主机防火墙引擎: ufw / none

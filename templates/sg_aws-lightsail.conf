# AWS Lightsail 节点预设模版 - 新加坡 (Singapore)
# 使用方式: ./cnsr.sh init-aws -f sg_aws-lightsail [--count 2]

PROVIDER="lightsail"          # 服务类型 (lightsail / ec2)
REGION="ap-southeast-1"       # [必需] AWS 区域代码 (新加坡: ap-southeast-1)
ZONE=""                       # [可选] 可用区 (留空由 AWS 自动选择，或填 ap-southeast-1a)
ALIAS="sg_aws-lightsail"      # [必需] 默认别名前缀 (多台时自动生成 sg_aws-lightsail-1, sg_aws-lightsail-2...)
BUNDLE="nano_3_0"             # 套餐规格: $5/月 (512MB RAM / 2 vCPU)
BLUEPRINT="debian_12"         # 系统镜像: Debian 12 (或 ubuntu_22_04)
KEY=""                        # AWS 控制台上传的公钥名称 (留空则默认使用该区域 Default 公钥)
